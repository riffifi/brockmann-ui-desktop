[package]
name = "brockmann"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Metro and Swiss modernist UI toolkit"

[features]
default = ["sound"]
sound = ["dep:cpal"]

[dependencies]
cpal = { version = "0.16", optional = true }
wgpu = "25.0.2"
winit = "0.30.13"
cosmic-text = "0.19.0"
accesskit = "0.24.1"
accesskit_winit = "0.32.2"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
arboard = "3.6"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
roxmltree = "0.20"
lyon_svg = "0.17"
lyon_tessellation = "0.17"

[dev-dependencies]
png = "0.17"

[[example]]
name = "demo"
path = "examples/demo.rs"
